<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Clean white background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Geometric interpretation of PJ -->
  <g>
    <!-- Stylized P - semicircle + line -->
    <path d="M50 50 L50 150" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
    <path d="M50 70 A30 30 0 0 1 50 130" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Stylized J - hook shape -->
    <path d="M110 50 L110 130 Q110 150 90 150" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Subject dot -->
    <circle cx="150" cy="100" r="12" fill="currentColor"/>
  </g>
</svg>
